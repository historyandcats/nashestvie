function footer(){return `<div class="footer"><span>История и котики · Интерактивная летопись</span><span>По скрипту «Нашествия с востока и запада» · ${storageOK?'Прогресс сохраняется в этом браузере':'Сохранение недоступно — не закрывай вкладку'}</span></div>`}
function home(){if(state.exhausted)return gameOver();screen='home';active=-1;let n=count();$('#app').innerHTML=`<div class="screen"><section class="hero"><div><div class="eyebrow">Историческое приключение · XIII век</div><h1>Важные вести.<br><em>Большая история.</em></h1><p>Стань гонцом, собери потерянные страницы летописи и помоги Руси сохранить память о нашествиях с востока и запада.</p><button class="btn" id="start">${total()?'Продолжить путешествие':'Отправиться в путь'} <span>→</span></button><p class="smallnote">6 миссий · 20–30 минут · 5 жизней на весь путь</p></div><div class="scene">${art()}<span class="tag">Твой спутник — кот-гонец Квакс</span></div></section><div class="journey-head"><h2>Дорога через историю</h2><span class="progress-meta">${n} из 6 печатей собрано</span></div><div class="mission-grid">${DATA.missions.map((m,i)=>{let done=state.progress[i]>=m.tasks.length,open=i===0||state.progress[i-1]>=DATA.missions[i-1].tasks.length;return `<button class="mission ${done?'done':!open?'locked':'current'}" data-mission="${i}" ${open?'':'disabled'}><span class="number">${done?'✓':String(i+1).padStart(2,'0')}</span><span class="status">${done?'Печать получена':open?'Путь открыт':'Откроется дальше'}</span><h3>${m.title}</h3><div class="meta">${m.date}<br>${m.place}</div><span class="arrow">${open?'↗':'·'}</span></button>`}).join('')}</div><div class="ribbon"><div><b>Последняя остановка — твоя летопись</b><br><span style="color:var(--muted)">Соедини события, людей и последствия в одну историю.</span></div><button class="${n===6?'btn finishlink':'quiet'}" id="final-start" ${n===6?'':'disabled'}>${state.complete?'Открыть летопись':n===6?'Собрать летопись →':'Нужно 6 печатей'}</button></div><div class="actions"><button class="quiet" id="bag-home">Сумка гонца · ${state.lives}/5 ♥</button><button class="quiet" id="about">Об игре</button><button class="quiet" id="reset">Начать заново</button></div>${footer()}</div>`;$('#start').onclick=()=>{let i=state.progress.findIndex((p,i)=>p<DATA.missions[i].tasks.length);i<0?startFinal():intro(i)};document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>intro(+b.dataset.mission));$('#final-start').onclick=()=>state.complete?ending():startFinal();$('#bag-home').onclick=bag;$('#about').onclick=about;$('#reset').onclick=resetDialog;window.scrollTo(0,0)}
function shell(content){let m=active===6?{title:'Большая летопись',date:'Финальное поручение',intro:'Все печати собраны. Теперь восстановим историю целиком.'}:DATA.missions[active];$('#app').innerHTML=`<div class="screen"><div class="game-nav"><button class="quiet" id="back">← Карта пути</button><button class="quiet" id="bag">▤ Сумка · ${state.lives}/5 ♥</button></div><div class="game-layout"><aside class="aside"><div class="art">${art(m.icon)}</div><div class="aside-content"><span class="eyebrow">${active===6?'Финал':'Миссия '+String(active+1).padStart(2,'0')}</span><h3>${m.title}</h3><p>${screen==='task'&&!solved?'Проверь свою память':m.date}</p><div class="steps">${Array.from({length:active===6?finalTasks.length:6},(_,i)=>`<span class="step ${i<taskIndex?'done':i===taskIndex?'now':''}"></span>`).join('')}</div><p class="quote">«Каждая верная весть — ещё одна сохранённая страница».<br>— Квакс</p></div></aside><section class="quest">${content}</section></div>${footer()}</div>`;$('#back').onclick=home;$('#bag').onclick=bag;window.scrollTo(0,0)}
function intro(i){if(state.exhausted)return gameOver();active=i;screen='intro';taskIndex=state.progress[i]>=6?0:state.progress[i];let m=DATA.missions[i];shell(`<div class="eyebrow">Новое поручение</div><h2>${m.title}</h2><p class="lead">${m.intro}</p><h3>Прочитай дорожные заметки</h3><ul class="notes">${m.notes.map(n=>`<li>${n}</li>`).join('')}</ul><div class="actions"><button class="btn" id="begin">${taskIndex?'Продолжить с задания '+(taskIndex+1):'Принять поручение'} →</button></div><span class="source">Заметки останутся в сумке. Можно возвращаться к ним в любой момент.</span>`);$('#begin').onclick=()=>loadTask()}

function bodyTask(q){if(q.type==='date')return `<div class="date-fields">${q.answer.map((_,i)=>`<label>${q.answer.length===1?'Год':['День','Месяц','Год'][i]}<input data-date="${i}" inputmode="numeric" autocomplete="off" maxlength="${q.answer.length===1||i===2?4:2}" value="${esc(selection[i]||'')}" ${solved?'disabled':''}></label>`).join('')}</div>`;if(q.type==='pick'||q.type==='multi'||q.type==='repair')return `${q.type==='repair'?`<div class="repair-scroll">${solved?esc(q.after):esc(q.before).replace(/\[(.*?)\]/g,'<mark>$1</mark>')}</div>`:''}<div class="options">${q.options.map((o,i)=>`<button class="option ${selection.includes(i)?'selected':''}" data-option="${i}" aria-pressed="${selection.includes(i)}" ${solved?'disabled':''}><span class="letter">${q.type==='multi'?(selection.includes(i)?'✓':'+'):'АБВГД'[i]}</span>${esc(o)}</button>`).join('')}</div>`;

return `<div class="pairs"><div class="paircol">${q.pairs.map((p,i)=>`<button class="pairbtn ${left===i?'chosen':''} ${pairs[i]!==undefined?'paired':''}" data-left="${i}" ${solved?'disabled':''}>${pairs[i]!==undefined?String(i+1)+' · ':''}${esc(p[0])}</button>`).join('')}</div><div class="paircol">${rightOrder.map(i=>`<button class="pairbtn ${Object.values(pairs).includes(i)?'paired':''}" data-right="${i}" ${solved?'disabled':''}>${Object.values(pairs).includes(i)?String(+Object.keys(pairs).find(k=>pairs[k]===i)+1)+' · ':''}${esc(q.pairs[i][1])}</button>`).join('')}</div></div><div class="pair-status" role="status">${left!==null?'Теперь выбери подходящую карточку справа.':Object.keys(pairs).length===q.pairs.length?'Все пары собраны. Проверь их перед отправкой.':'Нажми карточку слева, затем её пару справа.'}</div>`}
function ready(){let q=task();if(q.type==='date')return q.answer.every((_,i)=>/^\d{1,4}$/.test(selection[i]||''));return q.type==='order'?sequence.length===q.items.length:q.type==='match'?Object.keys(pairs).length===q.pairs.length:selection.length>0}
function renderTask(){let oldY=window.scrollY;let q=task();let typ={date:'Восстанови дату по памяти',pick:'Выбери ответ',multi:'Выбери все верные карточки',order:'Восстанови порядок',match:'Соедини сведения',repair:'Исправь донесение'};shell(`<div class="eyebrow">${taskIndex+1} / ${tasks().length} · ${typ[q.type]}</div><h2>${q.title}</h2><p class="lead">${q.story}</p><div id="task-body">${bodyTask(q)}</div>${hintOpen?`<div class="hint"><b>Подсказка из летописи</b><br>${q.type==='order'&&!solved?'Вспомни, какое событие подготовило следующее. Даты появятся в объяснении после верного ответа.':q.ex}<span class="source">Страница PDF: ${[].concat(q.page).join(', ')}</span></div>`:''}${feedback?`<div class="feedback ${solved?'':'bad'}" role="status"><strong>${solved?'Печать поставлена!':'Донесение пока не сходится'}</strong><p>${solved?q.ex:feedback}</p>${solved?`<span class="source">По скрипту, страница PDF: ${[].concat(q.page).join(', ')}</span>`:''}</div>`:''}<div class="actions">${solved?'<button class="btn" id="next">Дальше →</button>':`<button class="btn" id="check" ${ready()?'':'disabled'}>Поставить печать</button><button class="quiet" id="hint">Подсказка</button>`}</div>`);bindTask();window.scrollTo(0,oldY)}
function bindTask(){document.querySelectorAll('[data-date]').forEach(b=>b.oninput=()=>{b.value=b.value.replace(/[^0-9]/g,'');selection[+b.dataset.date]=b.value;$('#check').disabled=!ready()});document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{let v=+b.dataset.option;selection=task().type==='multi'?(selection.includes(v)?selection.filter(x=>x!==v):[...selection,v]):[v];renderTask()});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{sequence.push(+b.dataset.order);renderTask()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{sequence.splice(+b.dataset.remove,1);renderTask()});document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{let i=+b.dataset.left;if(pairs[i]!==undefined)delete pairs[i];left=i;renderTask()});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(left===null){toast('Сначала выбери карточку слева');return}let i=+b.dataset.right;for(let k of Object.keys(pairs))if(pairs[k]===i)delete pairs[k];pairs[left]=i;left=null;announce('Пара выбрана. Проверка после отправки.');renderTask()});if($('#check'))$('#check').onclick=check;if($('#hint'))$('#hint').onclick=()=>{state.hints[key()]=true;save();hintOpen=true;renderTask()};if($('#next'))$('#next').onclick=advance}
function check(){if(state.exhausted)return gameOver();if(solved||!ready())return;let q=task(),ok=q.type==='order'?sequence.every((v,i)=>v===i):q.type==='match'?Object.keys(pairs).length===q.pairs.length&&Object.entries(pairs).every(([a,b])=>+a===b):q.type==='date'?q.answer.every((v,i)=>Number(selection[i])===v):q.type==='multi'?selection.length===q.answer.length&&selection.every(v=>q.answer.includes(v)):selection[0]===q.answer;if(ok){solved=true;feedback=q.ex;if(active<6)state.progress[active]=Math.max(state.progress[active],taskIndex+1);else state.final=Math.max(state.final,taskIndex+1);save();announce('Верно! '+q.ex)}else{state.mistakes[key()]=(state.mistakes[key()]||0)+1;state.lives=Math.max(0,state.lives-1);save();if(state.lives===0){state=freshState();state.lives=0;state.exhausted=true;save();gameOver();return}if(q.type==='match'){for(let k of Object.keys(pairs))if(+k!==pairs[k])delete pairs[k]}feedback=q.type==='match'?'Верные пары сохранены. Остальные карточки нужно соединить заново.':q.type==='date'?'Дата пока неверна. Проверь каждое поле и попробуй ещё.':q.type==='order'?'Проверь, что было раньше, а что позже. Карточки можно убрать крестиком и поставить заново.':q.type==='multi'?'Проверь каждый выбранный пункт: нужны все верные карточки и ни одной лишней.':'Попробуй другой ответ. Дорожные заметки доступны в сумке.';feedback+=' Потеряна 1 жизнь. Осталось: '+state.lives+' из 5.';if(state.mistakes[key()]>=2){hintOpen=true;state.hints[key()]=true;save()}}renderTask()}
function advance(){if(taskIndex+1<tasks().length){taskIndex++;loadTask()}else if(active===6){state.complete=true;save();ending()}else missionDone()}
function missionDone(){screen='done';let m=DATA.missions[active];shell(`<div class="complete"><div class="stamp">ВЕСТЬ<br>ДОСТАВЛЕНА</div><div class="eyebrow">Миссия завершена</div><h2>${m.title}</h2><p>Ещё одна страница на своём месте. Ты сохранил важные сведения — они останутся в сумке гонца.</p><div class="book-card"><strong>Запомни из этой главы</strong>${m.notes.join('<br><br>')}</div><div class="actions"><button class="btn" id="continue">${active===5?'К финальному поручению':'Следующая миссия'} →</button><button class="quiet" id="mapdone">На карту</button></div></div>`);$('#continue').onclick=()=>active===5?startFinal():intro(active+1);$('#mapdone').onclick=home}
function startFinal(){if(state.exhausted)return gameOver();active=6;finalTasks=[...DATA.final];let extra=Object.keys(state.mistakes).filter(k=>+k.split(':')[0]<6).sort((a,b)=>state.mistakes[b]-state.mistakes[a]).slice(0,2);extra.forEach(k=>{let [m,t]=k.split(':').map(Number);let q=DATA.missions[m].tasks[t];finalTasks.push({...q,title:'Ещё раз: '+q.title})});taskIndex=state.final<finalTasks.length?state.final:0;loadTask()}
function ending(){screen='ending';active=6;if(!finalTasks.length)finalTasks=DATA.final;taskIndex=finalTasks.length;shell(`<div class="complete"><div class="stamp">ХРАНИТЕЛЬ<br>ИСТОРИИ</div><div class="eyebrow">Летопись восстановлена</div><h2>Важные вести<br>теперь у тебя.</h2><p>Ты прошёл путь с Кваксом, собрал шесть печатей и связал даты, людей и последствия событий.</p><div class="stars">✦ ✦ ✦</div><div class="book">${[['1223','Битва на Калке. Разрозненные действия князей.'],['1237–1238','Поход Батыя на Северо-Восточную Русь.'],['15 июля 1240','Невская битва. Александр и шведское войско.'],['6 декабря 1240','Падение Киева. Воевода Дмитр. Десятинная церковь.'],['5 апреля 1242','Ледовое побоище. Чудское озеро. Ливонский орден.'],['1243','Ярослав Всеволодович получает ярлык.']].map(([a,b])=>`<div class="book-card"><strong>${a}</strong>${b}</div>`).join('')}</div><p style="font-size:13px">Печати: 6 из 6 · Заданий с подсказками: ${Object.keys(state.hints).length}<br>Все миссии доступны для повторного прохождения.</p><div class="actions"><button class="btn" id="endhome">Вернуться на карту</button><button class="quiet" id="print">Сохранить летопись в PDF / печать</button></div></div>`);$('#endhome').onclick=home;$('#print').onclick=()=>window.print()}
function modal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;$('#modal').showModal()}

function lifePanel(){return `<div class="life-panel"><div class="hearts" aria-label="Осталось жизней: ${state.lives} из 5">${Array.from({length:5},(_,i)=>`<span class="${i<state.lives?'':'lost'}" aria-hidden="true">♥</span>`).join('')}</div><b>${state.lives} из 5 жизней</b><p>Один неверно отправленный ответ — одна жизнь. Запас общий для всех миссий и финала. Подсказки бесплатны.</p></div>`}
function gameOver(){screen='gameover';active=-1;taskIndex=0;finalTasks=[];$('#app').innerHTML=`<div class="screen quest complete" style="max-width:750px;margin:30px auto"><div class="eyebrow">Путешествие завершилось</div><h2 style="margin-top:18px">Пять жизней закончились</h2>${lifePanel()}<p>Квакс готов попробовать ещё раз! Печати и пройденные задания сброшены. Новый путь начнётся с первой миссии и пяти жизней.</p><div class="actions"><button class="btn" id="restart-path">Начать путь заново →</button></div></div>${footer()}`;$('#restart-path').onclick=()=>{state=freshState();save();intro(0)};announce('Жизни закончились. Нужно начать весь путь заново.');window.scrollTo(0,0)}

function bag(){let upto=active>=0?Math.min(active,5):Math.max(0,state.progress.findLastIndex(p=>p>0));modal('Сумка гонца',`${lifePanel()}<p style="color:var(--muted);margin-bottom:20px">Дорожные заметки можно перечитывать. Здесь только уже открытые главы.</p><div class="bag-grid">${DATA.missions.slice(0,upto+1).map((m,i)=>`<div class="bag-card"><b>${i+1}. ${m.title}</b>${m.notes.map(n=>`<p style="margin:8px 0">${n}</p>`).join('')}</div>`).join('')}</div>`)}
function about(){modal('О путешествии',`<p>«Гонец» — учебная игра проекта «История и котики». Кот Квакс и его поручения вымышлены. Даты, личности и события взяты из скрипта «Нашествия с востока и запада» («безредак 4.pdf»).</p><ul class="notes"><li>6 миссий, 36 заданий и итоговое повторение.</li><li>На весь путь, включая финал, даётся 5 жизней. Каждая неверная отправка отнимает одну жизнь, даже если в наборе несколько ошибок. После пятой ошибки весь путь начинается заново. Подсказки и чтение заметок бесплатны; переходы и перезагрузка не восстанавливают жизни.</li><li>География на иллюстрации условная: это карта путешествия, а не исторический атлас.</li><li>Игра работает без интернета. Ссылка на Telegram открывается отдельно.</li><li>Прогресс хранится только в этом браузере и никуда не отправляется. При переносе файла или смене браузера он может не сохраниться.</li></ul>`)}
function resetDialog(){modal('Начать с чистой страницы?',`<p>Все печати, ответы и подсказки в этом браузере будут сброшены.</p><div class="actions"><button class="btn" id="confirm-reset">Да, начать заново</button><button class="quiet" id="cancel-reset">Сохранить прогресс</button></div>`);$('#confirm-reset').onclick=()=>{state=freshState();save();$('#modal').close();home()};$('#cancel-reset').onclick=()=>$('#modal').close()}
$('#close-modal').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});$('#brand').onclick=e=>{e.preventDefault();home()};home();
</script></body></html>
